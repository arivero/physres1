title: "Physics Research Notes"
description: "Companion papers — A. Rivero and A.I.Scaffold"
theme: minima
markdown: CommonMarkGhPages
commonmark:
  options: ["UNSAFE", "SMART", "FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table", "tagfilter"]
minima:
  nav_pages:
    - about.md
    - portfolio.md
    - index.html
kramdown:
  input: GFM
  math_engine: nil
  hard_wrap: false
  entity_output: as_input
